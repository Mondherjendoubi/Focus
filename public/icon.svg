<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="tutorex">
  <!-- The app mark: lucide `highlighter`, the same glyph AppLogo renders, on the
       brand blue ramp (--color-blue-500 → -600). Paths are copied verbatim from
       @iconify-json/lucide so the icon and the in-app logo can never diverge.
       Geometry: the glyph's inked box is x 2…23, y 3…21 in its own 24 grid once
       the 2-unit stroke is counted, so it is scaled ×12 and offset to sit dead
       centre rather than scaled off the raw viewBox, which would sit 5px right. -->
  <defs>
    <linearGradient id="tutorex-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3565F5"/>
      <stop offset="1" stop-color="#2148D9"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tutorex-bg)"/>

  <g transform="translate(106 112) scale(12)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <path d="m9 11l-6 6v3h9l3-3"/>
    <path d="m22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>
  </g>
</svg>
